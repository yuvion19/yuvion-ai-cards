<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Обрезка фото</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111827;background:#f6f7fb}
*{box-sizing:border-box} body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.app{width:min(980px,100%);background:#fff;border:1px solid #e5e7eb;border-radius:24px;box-shadow:0 18px 60px rgba(0,0,0,.08);overflow:hidden}
.header{padding:24px 28px;border-bottom:1px solid #eef0f4;display:flex;justify-content:space-between;gap:16px;align-items:center}
h1{font-size:22px;margin:0}.sub{font-size:13px;color:#6b7280;margin-top:4px}.main{padding:28px}
.drop{border:2px dashed #cfd4dc;border-radius:18px;padding:44px 20px;text-align:center;background:#fafbfc;cursor:pointer;transition:.2s}
.drop.drag{border-color:#111827;background:#f3f4f6}.drop strong{display:block;font-size:18px;margin-bottom:8px}.drop span{color:#6b7280;font-size:14px}
button,.fileBtn,select{font:inherit}.fileBtn,.btn{border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:#111827;color:white;font-weight:600}.btn.secondary{background:#eef0f4;color:#111827}.btn:disabled{opacity:.45;cursor:not-allowed}
.workspace{display:none}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}.toolbar label{font-size:13px;color:#4b5563}.toolbar select{border:1px solid #d9dde5;border-radius:10px;padding:10px 12px;background:white}
.stage{position:relative;display:flex;justify-content:center;align-items:center;min-height:420px;background:#111827;border-radius:18px;overflow:hidden;touch-action:none}
.stage img{max-width:100%;max-height:70vh;display:block;user-select:none;-webkit-user-drag:none}
.crop{position:absolute;border:2px solid white;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move;min-width:40px;min-height:40px}
.handle{position:absolute;width:18px;height:18px;background:white;border:2px solid #111827;border-radius:50%}.se{right:-10px;bottom:-10px;cursor:nwse-resize}.nw{left:-10px;top:-10px;cursor:nwse-resize}.ne{right:-10px;top:-10px;cursor:nesw-resize}.sw{left:-10px;bottom:-10px;cursor:nesw-resize}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.preview{margin-top:20px;display:none}.preview h2{font-size:16px}.preview img{max-width:100%;border-radius:14px;border:1px solid #e5e7eb;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/20px 20px}
@media(max-width:640px){body{padding:0}.app{border-radius:0;min-height:100vh;border:0}.header,.main{padding:18px}.stage{min-height:340px}.toolbar{align-items:stretch}.toolbar>*{flex:1 1 auto}.btn,.fileBtn,select{width:100%}}
</style>
</head>
<body>
<div class="app">
  <div class="header"><div><h1>Обрезка фото</h1><div class="sub">Загрузите изображение, выделите область и скачайте результат</div></div></div>
  <div class="main">
    <div id="drop" class="drop">
      <strong>Перетащите фото сюда</strong><span>или выберите файл JPG, PNG или WEBP</span><br><br>
      <label class="fileBtn">Выбрать фото<input id="file" type="file" accept="image/jpeg,image/png,image/webp" hidden></label>
    </div>
    <div id="workspace" class="workspace">
      <div class="toolbar">
        <label>Пропорции<br><select id="ratio"><option value="free">Свободно</option><option value="1">1:1</option><option value="0.75">3:4</option><option value="1.333333">4:3</option><option value="1.777777">16:9</option></select></label>
      </div>
      <div id="stage" class="stage"><img id="img" alt=""><div id="crop" class="crop"><i class="handle nw"></i><i class="handle ne"></i><i class="handle sw"></i><i class="handle se"></i></div></div>
      <div class="actions"><button id="cropBtn" class="btn">Обрезать</button><button id="downloadBtn" class="btn" disabled>Скачать</button><button id="resetBtn" class="btn secondary">Сбросить</button><button id="otherBtn" class="btn secondary">Загрузить другое</button></div>
      <div id="preview" class="preview"><h2>Результат</h2><img id="out" alt="Обрезанное фото"></div>
    </div>
  </div>
</div>
<script>
const file=document.getElementById('file'),drop=document.getElementById('drop'),workspace=document.getElementById('workspace'),stage=document.getElementById('stage'),img=document.getElementById('img'),crop=document.getElementById('crop'),ratio=document.getElementById('ratio'),preview=document.getElementById('preview'),out=document.getElementById('out'),downloadBtn=document.getElementById('downloadBtn');
let sourceName='photo', state={x:0,y:0,w:100,h:100}, drag=null, resultBlob=null;
function load(f){ if(!f||!/^image\/(jpeg|png|webp)$/.test(f.type)) return; sourceName=f.name.replace(/\.[^.]+$/,'')||'photo'; const url=URL.createObjectURL(f); img.onload=()=>{ drop.style.display='none'; workspace.style.display='block'; requestAnimationFrame(initCrop); }; img.src=url; preview.style.display='none'; downloadBtn.disabled=true; resultBlob=null; }
file.onchange=e=>load(e.target.files[0]);
['dragenter','dragover'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.add('drag')}));
['dragleave','drop'].forEach(ev=>drop.addEventListener(ev,e=>{e.preventDefault();drop.classList.remove('drag')})); drop.addEventListener('drop',e=>load(e.dataTransfer.files[0]));
function bounds(){ const s=stage.getBoundingClientRect(), r=img.getBoundingClientRect(); return {left:r.left-s.left,top:r.top-s.top,w:r.width,h:r.height}; }
function initCrop(){const b=bounds(); state={x:b.left+b.w*.1,y:b.top+b.h*.1,w:b.w*.8,h:b.h*.8}; applyRatio(true); render();}
function render(){Object.assign(crop.style,{left:state.x+'px',top:state.y+'px',width:state.w+'px',height:state.h+'px'});}
function clamp(){const b=bounds(); state.w=Math.max(40,Math.min(state.w,b.left+b.w-state.x)); state.h=Math.max(40,Math.min(state.h,b.top+b.h-state.y)); state.x=Math.max(b.left,Math.min(state.x,b.left+b.w-state.w)); state.y=Math.max(b.top,Math.min(state.y,b.top+b.h-state.h));}
function applyRatio(center=false){ if(ratio.value==='free') return; const ar=+ratio.value,b=bounds(); let w=state.w,h=w/ar; if(h>b.h*.9){h=b.h*.9;w=h*ar} if(w>b.w*.9){w=b.w*.9;h=w/ar} const cx=center?b.left+b.w/2:state.x+state.w/2, cy=center?b.top+b.h/2:state.y+state.h/2; state.w=w;state.h=h;state.x=cx-w/2;state.y=cy-h/2;clamp();render();}
ratio.onchange=()=>applyRatio(false);
function pos(e){ const r=stage.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top};}
function start(e,mode){e.preventDefault();const p=pos(e);drag={mode,sx:p.x,sy:p.y,orig:{...state}};}
crop.addEventListener('pointerdown',e=>{ if(e.target.classList.contains('handle')) return; start(e,'move');}); crop.querySelectorAll('.handle').forEach(h=>h.addEventListener('pointerdown',e=>start(e,[...h.classList].find(c=>['nw','ne','sw','se'].includes(c)))));
window.addEventListener('pointermove',e=>{if(!drag)return;const p=pos(e),dx=p.x-drag.sx,dy=p.y-drag.sy,o=drag.orig;if(drag.mode==='move'){state={...state,x:o.x+dx,y:o.y+dy};clamp();render();return;}let x=o.x,y=o.y,w=o.w,h=o.h;if(drag.mode.includes('e'))w=o.w+dx;if(drag.mode.includes('s'))h=o.h+dy;if(drag.mode.includes('w')){w=o.w-dx;x=o.x+dx}if(drag.mode.includes('n')){h=o.h-dy;y=o.y+dy}if(ratio.value!=='free'){const ar=+ratio.value;if(Math.abs(dx)>Math.abs(dy)){h=w/ar;if(drag.mode.includes('n'))y=o.y+o.h-h}else{w=h*ar;if(drag.mode.includes('w'))x=o.x+o.w-w}}state={x,y,w,h};clamp();render();});
window.addEventListener('pointerup',()=>drag=null);
document.getElementById('resetBtn').onclick=initCrop; document.getElementById('otherBtn').onclick=()=>{workspace.style.display='none';drop.style.display='block';file.value='';};
document.getElementById('cropBtn').onclick=()=>{const b=bounds(), sx=img.naturalWidth/b.w, sy=img.naturalHeight/b.h; const x=(state.x-b.left)*sx,y=(state.y-b.top)*sy,w=state.w*sx,h=state.h*sy; const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));c.getContext('2d').drawImage(img,x,y,w,h,0,0,c.width,c.height); const mime=file.files[0]?.type==='image/png'?'image/png':'image/jpeg'; c.toBlob(blob=>{resultBlob=blob;out.src=URL.createObjectURL(blob);preview.style.display='block';downloadBtn.disabled=false;preview.scrollIntoView({behavior:'smooth',block:'nearest'});},mime,mime==='image/jpeg'?.95:undefined);};
downloadBtn.onclick=()=>{if(!resultBlob)return;const a=document.createElement('a');a.href=URL.createObjectURL(resultBlob);a.download=sourceName+'-cropped.'+(resultBlob.type==='image/png'?'png':'jpg');a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
window.addEventListener('resize',()=>{if(workspace.style.display==='block')initCrop()});
</script>
</body>
</html>
