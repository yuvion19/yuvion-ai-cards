heet{width:min(720px,100%);margin:auto;background:#101b2d;border-radius:24px 24px 0 0;padding:16px 16px 28px;max-height:88vh;overflow:auto}.sheet img{width:100%;border-radius:18px;aspect-ratio:16/10;object-fit:cover}.cta{width:100%;border:0;border-radius:14px;padding:14px;background:linear-gradient(135deg,#559cff,#7547e8);color:#fff;font-weight:900}.empty{text-align:center;color:#93a2b5;grid-column:1/-1;padding:30px}@media(min-width:650px){.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><main class="app"><div class="top"><div><div class="brand">UVMALL</div><div class="sub">Южные Ворота онлайн</div></div><button onclick="location.href='./setup.html'" style="background:#111d31;border:1px solid #263652;color:#fff;border-radius:12px;padding:10px">⚙</button></div><section class="hero"><h1>Найдите товар быстрее</h1><p>Каталог продавцов, оптовые цены и павильоны ТК «Южные Ворота» прямо в Telegram.</p></section><input id="search" class="search" placeholder="Товар, продавец или павильон…"><div class="quick"><button onclick="showNew()">✦ Новинки</button><button onclick="showDeals()">🔥 Акции</button><button onclick="showFav()">♡ Избранное</button></div><div id="chips" class="chips"></div><div id="grid" class="grid"></div></main><nav class="bottom"><button onclick="reset()">⌂<br>Главная</button><button onclick="search.focus()">⌕<br>Поиск</button><button onclick="showFav()">♡<br>Избранное</button><button onclick="openWeb()">↗<br>UVMALL.ru</button></nav><div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="sheet" class="sheet"></div></div><script>

{id:'1002',title:'Набор полотенец 6 шт.',category:'Текстиль',price:790,wholesale:640,moq:12,seller:'Cotton Market',pavilion:'C-118',badge:'Опт',image:'https://images.unsplash.com/photo-1600369671236-e74521d4b6ad?auto=format&fit=crop&w=900&q=80'},

{id:'1005',title:'Плед 200×220 см',category:'Текстиль',price:990,wholesale:810,moq:10,seller:'Comfort Home',pavilion:'D-145',badge:'Новинка',image:'https://images.unsplash.com/photo-1580301762395-21ce84d00bc6?auto=format&fit=crop&w=900&q=80'}];let cat='';const fav=new Set(JSON.parse(localStorage.getItem('uvmall:fav')||'[]'));const rub=n=>new Intl.NumberFormat('ru-RU').format(n)+' ₽';function chipsDraw(){const c=['Все',...new Set(items.map(x=>x.category))];chips.innerHTML=c.map(x=>'<button class="chip '+((x==='Все'&&!cat)||x===cat?'active':'')+'" onclick="setCat(\''+(x==='Все'?'':x)+'\')">'+x+'</button>').join('')}function setCat(x){cat=x;chipsDraw();apply()}function apply(){const q=search.value.toLowerCase().trim();render(items.filter(x=>(!cat||x.category===cat)&&(!q||(x.title+' '+x.seller+' '+x.pavilion).toLowerCase().includes(q))))}function render(a){grid.innerHTML=a.length?a.map(p=>'<article class="card" onclick="openP(\''+p.id+'\')"><div class="pic"><img src="'+p.image+'"><span class="badge">'+p.badge+'</span></div><div class="body"><div class="title">'+p.title+'</div><div class="price">'+rub(p.price)+'</div><div class="wh">Опт '+rub(p.wholesale)+' от '+p.moq+' шт.</div><div class="seller">'+p.seller+' · '+p.pavilion+'</div></div></article>').join(''):'<div class="empty">Ничего не найдено</div>'}function openP(id){const p=items.find(x=>x.id===id);sheet.innerHTML='<button onclick="closeModal()" style="float:right">Закрыть</button><img src="'+p.image+'"><h2>'+p.title+'</h2><div class="price">'+rub(p.price)+'</div><div class="wh">Оптовая цена '+rub(p.wholesale)+' от '+p.moq+' шт.</div><p>Продавец: '+p.seller+'<br>Павильон: '+p.pavilion+'</p><button class="cta" onclick="openProduct(\''+p.id+'\')">🛍 Открыть на UVMALL.ru</button>';modal.style.display='flex';tg?.BackButton.show();tg?.BackButton.onClick(closeModal)}function closeModal(){modal.style.display='none';tg?.BackButton.hide()}function showNew(){render(items.filter(x=>x.badge==='Новинка'))}function showDeals(){render(items.filter(x=>x.badge==='Акция'))}function showFav(){render(items.filter(x=>fav.has(x.id)))}function reset(){cat='';search.value='';chipsDraw();render(items)}function openWeb(){const u='https://uvmall.ru';tg?.openLink?tg.openLink(u):window.open(u,'_blank')}function openProduct(id){const u='https://uvmall.ru/product/'+id;tg?.openLink?tg.openLink(u):window.open(u,'_blank')}search.addEventListener('input',apply);chipsDraw();render(items);
