<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Реставрация и исторические карты</title><link rel="stylesheet" href="./vendor/maplibre-gl.css"><link rel="stylesheet" href="./workspace.css"><style>#histMap{height:480px;border:1px solid var(--border);border-radius:14px;overflow:hidden}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stage{border:1px solid var(--border);border-radius:12px;padding:10px;background:#0e1318}.stage img{width:100%;height:230px;object-fit:cover;border-radius:9px}@media(max-width:760px){.cols{grid-template-columns:1fr}#histMap{height:360px}}</style></head><body><header><a href="./">← Карта</a><div><b>Реставрация и исторические карты</b><small>геопривязка · прозрачность · до / проект / после</small></div><a href="./research.html">Архив</a></header><main><section class="hero"><h1>Исторические слои</h1><p>Старые планы и аэрофото можно накладывать на современную геометрию вручную, не выдавая приблизительную привязку за точную.</p></section><section class="card"><div id="histMap"></div><label>URL старой карты / ортофото<input id="imageUrl"></label><div class="cols"><label>Запад<input id="west" type="number" step="0.000001" value="48.493"></label><label>Юг<input id="south" type="number" step="0.000001" value="41.36"></label><label>Восток<input id="east" type="number" step="0.000001" value="48.529"></label><label>Север<input id="north" type="number" step="0.000001" value="41.3875"></label></div><label>Прозрачность<input id="opacity" type="range" min="0" max="1" step="0.05" value="0.55"></label><div class="row wrap"><button id="addImage" class="primary">Наложить карту</button><button id="removeImage">Убрать</button><button id="saveLayer">Сохранить настройки</button></div></section><section class="card"><h2>Режим реставрации</h2><label>QQ-ID<select id="house"></select></label><div class="cols"><label>До<input id="before" placeholder="URL фото"></label><label>Проект<input id="plan" placeholder="URL визуализации"></label><label>После<input id="after" placeholder="URL фото"></label><label>Источник<input id="source" placeholder="Документ / URL"></label></div><button id="saveRestoration" class="primary">Сохранить этапы</button><div id="stages" class="cols"></div></section></main><script src="./vendor/maplibre-gl.js"></script><script src="./archive-core.js"></script><script src="./restoration.js"></script></body></html>
