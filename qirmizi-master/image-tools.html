<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Фотоинструменты — Красная Слобода</title><link rel="stylesheet" href="./workspace.css"><style>.preview{max-width:100%;max-height:420px;border-radius:12px}.matches{display:grid;gap:8px}.match{padding:10px;border:1px solid var(--border);border-radius:11px;background:#0e1318}.geo{display:grid;grid-template-columns:1fr 1fr;gap:8px}@media(max-width:700px){.geo{grid-template-columns:1fr}}</style></head><body><header><a href="./">← Карта</a><div><b>Фотоинструменты</b><small>EXIF · SHA-256 · dHash · геопривязка</small></div><a href="./research.html">Архив</a></header><main><section class="hero"><h1>Анализ изображения</h1><p>Поиск совпадений основан на метаданных и перцептивном хеше, а не на выдуманном распознавании здания.</p></section><section class="card"><label>Фотография<input id="file" type="file" accept="image/*"></label><img id="preview" class="preview hidden"><div id="meta" class="item"></div><div class="geo"><label>Широта<input id="lat" type="number" step="0.000001"></label><label>Долгота<input id="lon" type="number" step="0.000001"></label><label>Направление камеры<input id="dir" type="number" min="0" max="359"></label><label>QQ-ID<input id="house" placeholder="QQ-OSM-…"></label></div><button id="analyze" class="primary">Анализировать и сопоставить</button></section><section class="card"><h2>Предложения</h2><div id="matches" class="matches"></div></section><section class="card"><h2>Сохранить геопривязку</h2><label>Подпись<input id="caption"></label><label>Год<input id="year" type="number" min="1800" max="2100"></label><button id="save">Сохранить как архивный материал</button></section></main><script src="./archive-core.js"></script><script src="./image-tools.js"></script></body></html>
