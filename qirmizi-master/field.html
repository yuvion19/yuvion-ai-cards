<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0a0d10"><title>Полевая съёмка — Красная Слобода</title><link rel="stylesheet" href="./workspace.css"></head><body><header><a href="./">← Карта</a><div><b>Полевая съёмка</b><small>GPS · фото · QQ-ID · очередь</small></div><button id="locate" class="primary">Найти меня</button></header><main><section class="hero"><h1>Обход территории</h1><p>Система находит ближайший дом без фотографии, привязывает снимок к QQ-ID, сохраняет GPS, время и SHA-256 оригинала.</p><div class="metrics" id="metrics"></div></section><section class="card"><h2>Текущая точка</h2><div id="position" class="muted">Геопозиция не запрошена.</div><div id="nearest" class="target">Нажмите «Найти меня».</div><div class="row wrap"><button id="nextMissing">Ближайший без фото</button><button id="openMap">Открыть на карте</button></div></section><section class="card"><h2>Снять материал</h2><label>QQ-ID<input id="houseId" placeholder="QQ-OSM-…"></label><label>Тип<select id="kind"><option value="facade">Фасад</option><option value="yard">Двор</option><option value="detail">Архитектурная деталь</option><option value="document">Документ</option><option value="panorama">360°</option></select></label><label>Фото<input id="photo" type="file" accept="image/*" capture="environment"></label><label>Подпись<input id="caption" placeholder="Что изображено"></label><label>Источник / право использования<input id="rights" placeholder="Автор, архив, разрешение"></label><button id="save" class="primary big">Сохранить в очередь</button><div id="saveResult" class="muted"></div></section><section class="card"><h2>Очередь полевой съёмки</h2><div class="row wrap"><button id="exportQueue">Экспорт JSON</button><button id="clearSent">Очистить выгруженное</button></div><div id="queue"></div></section></main><script src="./archive-core.js"></script><script src="./field.js"></script></body></html>
