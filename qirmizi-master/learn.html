<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Образовательный режим — Красная Слобода</title><link rel="stylesheet" href="./workspace.css"><style>.quiz{display:grid;gap:10px}.qcard{padding:14px;border:1px solid var(--border);border-radius:12px;background:#0e1318}.answers{display:grid;gap:6px;margin-top:8px}.answers button{text-align:left}.storyStep{padding:12px;border-left:3px solid var(--accent);background:#0e1318;margin:8px 0;border-radius:0 10px 10px 0}</style></head><body><header><a href="./">← Карта</a><div><b>Образовательный режим</b><small>экскурсии · задания · истории · мини-тесты</small></div><a href="./research.html">Архив</a></header><main><section class="hero"><h1>Учиться через карту</h1><p>Вопросы и истории строятся только из уже внесённых и проверенных материалов. Если данных недостаточно, система не придумывает ответы.</p></section><section class="card"><h2>Мини-тест</h2><div class="row wrap"><button id="newQuiz" class="primary">Новый тест</button><span id="score" class="muted"></span></div><div id="quiz" class="quiz"></div></section><section class="card"><h2>Историческая история</h2><label>Название<input id="storyTitle"></label><label>QQ-ID шагов через запятую<textarea id="storyIds" rows="3"></textarea></label><label>Вступление<textarea id="storyIntro" rows="3"></textarea></label><button id="saveStory">Сохранить историю</button><div id="stories"></div></section><section class="card"><h2>Показ истории</h2><select id="storySelect"></select><button id="playStory" class="primary">Показать</button><div id="storyPlayer"></div></section></main><script src="./archive-core.js"></script><script src="./learn.js"></script></body></html>
