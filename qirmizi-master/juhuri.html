<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Архив джуури — Красная Слобода</title><link rel="stylesheet" href="./workspace.css"><style>.items{display:grid;gap:8px}.jitem{padding:12px;border:1px solid var(--border);border-radius:12px;background:#0e1318}.jitem audio{width:100%;margin-top:8px}</style></head><body><header><a href="./">← Карта</a><div><b>Архив джуури</b><small>язык · голос · рассказы · песни</small></div><a href="./translate.html">Переводы</a></header><main><section class="hero"><h1>Живой архив джуури</h1><p>Текст, произношение и аудио сохраняются как отдельные архивные материалы и могут быть связаны с домом, улицей или местом.</p></section><section class="card"><h2>Добавить запись</h2><label>Тип<select id="type"><option value="word">слово</option><option value="phrase">выражение</option><option value="story">рассказ</option><option value="song">песня</option><option value="proverb">пословица</option></select></label><label>Текст на джуури<textarea id="text" rows="3"></textarea></label><label>Перевод<textarea id="translation" rows="3"></textarea></label><label>QQ-ID / улица<input id="place"></label><label>Автор / носитель языка<input id="speaker"></label><label>Аудиофайл<input id="audioFile" type="file" accept="audio/*"></label><label>или URL аудио<input id="audioUrl"></label><button id="startRec">● Записать голос</button><button id="stopRec" disabled>■ Остановить</button><button id="save" class="primary big">Сохранить материал</button><div id="recStatus" class="muted"></div></section><section class="card"><h2>Архив</h2><input id="q" placeholder="Поиск"><div id="items" class="items"></div></section></main><script src="./archive-core.js"></script><script src="./juhuri.js"></script></body></html>
