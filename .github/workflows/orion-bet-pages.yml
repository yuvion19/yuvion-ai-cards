name: Deploy ORION BET to GitHub Pages
on:
  push:
    branches: [orion-bet-public]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: orion-bet-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload ORION BET
        uses: actions/upload-pages-artifact@v4
        with:
          path: orion-bet-public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
