name: Deploy MatchScope AI + UVMALL to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "matchscope-ai/**"
      - "uvmall-miniapp-pages/**"
      - ".github/workflows/matchscope-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "matchscope-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Stage Pages
        run: |
          rm -rf _pages
          mkdir -p _pages/uvmall
          cp -R matchscope-ai/. _pages/
          cp -R uvmall-miniapp-pages/. _pages/uvmall/
      - name: Upload Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _pages
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
