name: Deploy MatchScope AI to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "matchscope-ai/**"
      - ".github/workflows/matchscope-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "matchscope-pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload MatchScope
        uses: actions/upload-pages-artifact@v4
        with:
          path: matchscope-ai
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
