name: Deploy Nith Pamyati to GitHub Pages

on:
  push:
    branches:
      - nit-pamyati-independent
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild independent site
        run: |
          mkdir -p _site
          cat nit-pamyati/site.b64.* | base64 -d > /tmp/nit-pamyati.zip
          python3 -m zipfile -e /tmp/nit-pamyati.zip _site
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path("_site")
          prefix="/yuvion-ai-cards"
          for p in root.rglob("*"):
              if not p.is_file() or p.suffix not in {".html",".js",".webmanifest"}:
                  continue
              s=p.read_text(encoding="utf-8")
              s=re.sub(r'(["\'])/(?!/)', lambda m: m.group(1)+prefix+'/', s)
              p.write_text(s, encoding="utf-8")
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
