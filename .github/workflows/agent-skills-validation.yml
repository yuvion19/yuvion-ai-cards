name: Validate Agent Skills

on:
  pull_request:
    paths:
      - ".agents/skills/**"
      - "scripts/validate_agent_skills.py"
      - "tests/test_validate_agent_skills.py"
      - ".github/workflows/agent-skills-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test validation logic on synthetic fixtures
        run: python -m unittest discover -s tests -p test_validate_agent_skills.py -v
      - name: Validate repository skill definitions
        run: python scripts/validate_agent_skills.py .agents/skills
